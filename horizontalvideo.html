<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Rotated Video</title>
    <style>
        /* Remove borders and scrolling bars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Black background for a clean look */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Scale and rotate the video container */
        video {
            height: 100vw;   /* Force height to match screen width */
            width: 100vh;    /* Force width to match screen height */
            object-fit: cover; /* Crops slightly to ensure it fills 100% of the screen */
            transform: rotate(90deg);
        }
    </style>
</head>
<body>

    <!-- Remember to change "your-video.mp4" to your exact filename -->
    <video autoplay loop muted playsinline>
        <source src="ConfettiTandem.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

</body>
</html>
